<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>Parsec Audio Helper</title></head><body>
<header><strong>Parsec Audio Helper</strong><span id="connection">Checking…</span></header>
<section><h2>Video</h2><button id="video" disabled>Pause video</button><p id="traffic">Connect to Parsec to begin.</p></section>
<section><h2>Microphone</h2><select id="device"><option value="">Default microphone</option></select><div class="row"><button id="start" disabled>Start mic</button><button id="mute" disabled>Mute</button><button id="stop" disabled>Stop</button></div><p id="mic">Microphone off</p><p id="host"></p></section>
